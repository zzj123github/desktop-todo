<title>桌面待办 · iOS 交互原型（提案 v2.0）</title>
<link rel="stylesheet" href="../../ui/tokens.css">
<link rel="stylesheet" href="css/ios.css?v=1">
</head>
<body>

<!-- ================= 体验控制条 ================= -->
<header class="demo-bar" id="demoBar">
  <div class="db-brand">
    <span class="db-logo"><svg class="ic"><use href="#i-check"/></svg></span>
    <span class="db-name">桌面待办 · iOS</span>
    <span class="db-ver">提案 v2.0 · 待确认</span>
  </div>
  <div class="db-actions">
    <div class="db-seg" role="group" aria-label="切换预览场景">
      <button type="button" class="db-seg-btn on" data-scene="app">App</button>
      <button type="button" class="db-seg-btn" data-scene="widget">主屏幕小组件</button>
      <button type="button" class="db-seg-btn" data-scene="lock">锁屏</button>
    </div>
    <button class="db-btn" data-act="help" title="使用说明"><svg class="ic"><use href="#i-help"/></svg><span>怎么玩</span></button>
    <button class="db-btn" data-act="reset" title="恢复演示数据"><svg class="ic"><use href="#i-refresh"/></svg><span>重置演示</span></button>
  </div>
</header>

<!-- ================= 设备 ================= -->
<div class="stage">
  <div class="device" id="device">
    <div class="d-screen" id="dScreen">

      <!-- App 场景 -->
      <div class="scene scene-app" id="sceneApp">
        <div class="statusbar">
          <span class="sb-time">9:41</span>
          <span class="sb-right">
            <svg class="sb-ic" viewBox="0 0 18 12" aria-hidden="true"><path d="M1 8.5h2v3H1zM5 6.5h2v5H5zM9 4.5h2v7H9zM13 2.5h2v9h-2z" fill="currentColor"/></svg>
            <svg class="sb-ic" viewBox="0 0 16 12" aria-hidden="true"><path d="M8 9.6a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 0 1 0-2.8zM4.6 7.4a4.8 4.8 0 0 1 6.8 0l-1.3 1.3a3 3 0 0 0-4.2 0zM1.8 4.6a8.8 8.8 0 0 1 12.4 0l-1.3 1.3a7 7 0 0 0-9.8 0z" fill="currentColor"/></svg>
            <svg class="sb-ic sb-batt" viewBox="0 0 25 12" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="8" rx="1.6" fill="currentColor"/><path d="M23 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>
          </span>
        </div>
        <div class="island" aria-hidden="true"></div>
        <div class="app-root">
          <div class="page" id="page"></div>
          <nav class="tabbar" id="tabbar" aria-label="主导航">
            <button class="tab-item on" data-tab="today"><svg class="ic"><use href="#i-sun"/></svg><span>今天</span></button>
            <button class="tab-item" data-tab="views"><svg class="ic"><use href="#i-grid"/></svg><span>视图</span></button>
            <button class="tab-add" data-act="add" aria-label="添加任务"><svg class="ic"><use href="#i-plus"/></svg></button>
            <button class="tab-item" data-tab="done"><svg class="ic"><use href="#i-check-circle"/></svg><span>已完成</span></button>
            <button class="tab-item" data-tab="settings"><svg class="ic"><use href="#i-settings"/></svg><span>设置</span></button>
          </nav>
        </div>
      </div>

      <!-- 主屏幕小组件场景 -->
      <div class="scene scene-widget" id="sceneWidget" hidden></div>

      <!-- 锁屏场景 -->
      <div class="scene scene-lock" id="sceneLock" hidden></div>

      <!-- 弹层 / toast -->
      <div id="sheetLayer"></div>
      <div id="toastHost" class="toast-host"></div>
      <div class="home-indicator" aria-hidden="true"></div>
    </div>
  </div>
  <p class="stage-note" id="stageNote">iPhone 15 Pro · 393×852 · 与桌面版共用同一套设计令牌（暖纸底 / 陶土橙 / 衬线展示标题）</p>
</div>
