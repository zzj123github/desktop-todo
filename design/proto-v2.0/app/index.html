<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D97757'/%3E%3Cpath d='M9 16.5l5 5L23 11' stroke='%23fff' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>桌面待办 · 交互原型</title>
<link rel="stylesheet" href="../../ui/tokens.css">
<link rel="stylesheet" href="css/app.css?v=1795266200000">
<link rel="stylesheet" href="css/adjust.css?v=2">
<link rel="stylesheet" href="css/window-controls.css?v=1">
</head>
<body>
<div id="root" class="root is-desktop">

  <!-- ================= 桌面 ================= -->
  <div id="desktopScene" class="desktop">
    <div class="wall"></div>
    <div id="widgetLayer" class="widget-layer"></div>
    <div class="taskbar">
      <button class="tb-btn" aria-label="开始" data-act="noop"><svg class="ic"><use href="#i-grid"/></svg></button>
      <button class="tb-btn" aria-label="搜索" data-act="noop"><svg class="ic"><use href="#i-search"/></svg></button>
      <button class="tb-btn" aria-label="文件资源管理器" data-act="noop"><svg class="ic"><use href="#i-folder"/></svg></button>
      <div class="tb-sep"></div>
      <button class="tb-app" id="tbApp" data-act="restore-manager" hidden aria-label="还原桌面待办窗口">
        <span class="tb-app-ic"><svg class="ic"><use href="#i-check"/></svg></span><span>桌面待办</span>
      </button>
      <div class="tb-pin">桌面上一直看得见 · 点一下就能回到工作现场</div>
      <div class="tb-right">
        <div class="tb-clock"><div id="tbTime">15:49</div><div id="tbDate">2026/11/21</div></div>
      </div>
    </div>
  </div>

  <!-- ================= 完整窗口 ================= -->
  <div id="managerScene" class="manager-scene" hidden>
    <div class="mgr" id="mgr">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" id="main"></main>

      <!-- 窗口按钮（提案 v1.6）：按平台切换位置与样式 -->
      <div class="wc" id="winCtl">
        <!-- Windows：贴窗口右上角，方形悬停区 -->
        <div class="wc-win" role="group" aria-label="窗口控制">
          <button type="button" class="wcb" data-act="win-min" title="最小化" aria-label="最小化"><svg class="ic" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10"/></svg></button>
          <button type="button" class="wcb" data-act="win-max" title="最大化" aria-label="最大化"><svg class="ic i-max" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9"/></svg><svg class="ic i-restore" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 2.5v-2h7v7h-2"/><rect x="0.5" y="2.5" width="7" height="7"/></svg></button>
          <button type="button" class="wcb wcb-close" data-act="close-window" data-wc="close" title="关闭" aria-label="关闭"><svg class="ic" viewBox="0 0 10 10" aria-hidden="true"><path d="M0.6 0.6l8.8 8.8M9.4 0.6L0.6 9.4"/></svg></button>
        </div>
        <!-- macOS：贴窗口左上角的红绿灯 -->
        <div class="wc-mac" role="group" aria-label="窗口控制">
          <button type="button" class="tl tl-close" data-act="close-window" data-wc="close" title="关闭" aria-label="关闭"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="M3.4 3.4l5.2 5.2M8.6 3.4L3.4 8.6"/></svg></button>
          <button type="button" class="tl tl-min" data-act="win-min" title="最小化" aria-label="最小化"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.8 6h6.4"/></svg></button>
          <button type="button" class="tl tl-max" data-act="win-max" title="全屏（⌥ 单击缩放）" aria-label="全屏"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 7.4L7.4 3M3 3h4.4v4.4"/></svg></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= 浮层 ================= -->
  <div id="dpPop" class="dp-pop" hidden></div>
    <div id="popLayer" class="pop-layer"></div>
  <div id="overlay" class="overlay" hidden></div>
  <div id="toastHost" class="toast-host"></div>

  <!-- ================= 体验控制条 ================= -->
  <header class="demo-bar" id="demoBar">
    <div class="db-brand">
      <span class="db-logo"><svg class="ic"><use href="#i-check"/></svg></span>
      <span class="db-name">桌面待办</span>
      <span class="db-ver">可交互演示</span>
    </div>
    <div class="db-actions">
      <div class="db-seg" role="group" aria-label="切换窗口按钮预览平台（仅原型）">
        <button type="button" class="db-seg-btn on" data-plat="win" title="Windows 风格窗口按钮">Windows</button>
        <button type="button" class="db-seg-btn" data-plat="mac" title="macOS 风格窗口按钮">macOS</button>
      </div>
      <button class="db-btn" data-act="help" title="使用说明与快捷键"><svg class="ic"><use href="#i-help"/></svg><span>怎么玩</span></button>
      <button class="db-btn" data-act="reset" title="恢复演示数据"><svg class="ic"><use href="#i-refresh"/></svg><span>重置演示</span></button>
    </div>
  </header>

  <!-- ================= 图标 ================= -->
  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3.5 13.5h4.2l1.6 2.2h6.4l1.6-2.2h4.2"/><path d="M5 4.5h14l2 9v4.2a1.8 1.8 0 0 1-1.8 1.8H4.8A1.8 1.8 0 0 1 3 17.7v-4.2z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M2.5 12h2M19.5 12h2M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.6l8.6 15.2H3.4z"/><path d="M12 9.5v4.2M12 16.8v.4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.2" y="5" width="17.6" height="15" rx="2.2"/><path d="M8 3v4M16 3v4M3.2 10h17.6"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.8"/><path d="M8 12.4l2.6 2.6L16 9.6"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M4 4h6.2l9.6 9.6-6.2 6.2L4 10.2z"/><circle cx="8.2" cy="8.2" r="1.5"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5.5 20.5V4.2h10.8l-1.8 3.8 1.8 3.8H5.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3 1.8"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.6A2.1 2.1 0 0 1 5.1 4.5h4l2 2.1h8A2.1 2.1 0 0 1 21 8.7v9.2a2.1 2.1 0 0 1-2.1 2.1H5.1A2.1 2.1 0 0 1 3 17.9z"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.8"/><path d="M3.2 12h17.6M12 3.2a14.5 14.5 0 0 1 0 17.6M12 3.2a14.5 14.5 0 0 0 0 17.6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.6" cy="10.6" r="6.6"/><path d="M15.6 15.6l4.4 4.4"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h17M4 12h9M4 17h13"/><circle cx="8" cy="7" r="1.9" fill="currentColor" stroke="none"/><circle cx="17" cy="12" r="1.9" fill="currentColor" stroke="none"/><circle cx="10" cy="17" r="1.9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-.9 4.6 3 3.2H6.9l3-3.2z"/><path d="M12 11.8V20"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9.5 6.5V4.8A.8.8 0 0 1 10.3 4h3.4a.8.8 0 0 1 .8.8v1.7M7 6.5l.8 12.2a1.5 1.5 0 0 0 1.5 1.4h5.4a1.5 1.5 0 0 0 1.5-1.4L17 6.5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M13.5 3.5H6.6A1.6 1.6 0 0 0 5 5.1v13.8a1.6 1.6 0 0 0 1.6 1.6h10.8a1.6 1.6 0 0 0 1.6-1.6V9z"/><path d="M13.5 3.5V9H19"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4.5 19.5l4.1-1 10.2-10.2a1.6 1.6 0 0 0 0-2.3l-1-1a1.6 1.6 0 0 0-2.3 0L5.3 15.2z"/><path d="M13.6 6.7l3.7 3.7"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.43.5.76.94.92H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.8"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.4c-.8.4-1 1-1 1.9M12 16.6v.4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.4h-4.4"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M9.6 14.4l4.8-4.8"/><path d="M8.6 11.2L6.4 13.4a3.1 3.1 0 0 0 4.4 4.4l2.2-2.2"/><path d="M15.4 12.8l2.2-2.2a3.1 3.1 0 0 0-4.4-4.4l-2.2 2.2"/></symbol>
    <symbol id="i-notes" viewBox="0 0 24 24"><path d="M5 4.5h14v15H5z"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></symbol>
  </svg>

</div>
<script src="js/core.js?v=1795266200000"></script>
<script src="js/render.js?v=1795266200000"></script>
<script src="js/interactions.js?v=1795266200000"></script>
<script src="js/window-controls.js?v=1"></script>
</body>
</html>
