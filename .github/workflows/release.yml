name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-win:
    name: Build portable + installer
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pkg = node -p "require('./package.json').version"
          $tag = "${{ github.ref_name }}"
          if ("v$pkg" -ne $tag) {
            throw "Tag $tag does not match package.json version $pkg"
          }

      - name: Typecheck
        run: pnpm typecheck

      - name: Build app
        run: pnpm build

      - name: Fetch better-sqlite3 (Electron ABI)
        run: python scripts/fetch-native-assets.py --skip-electron

      - name: Package Windows (NSIS + portable)
        run: pnpm exec electron-builder --win --publish never

      - name: Verify two packages
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe | Format-Table Name, Length
          $setup = Get-ChildItem release\DesktopTodo-*-setup.exe -ErrorAction SilentlyContinue
          $portable = Get-ChildItem release\DesktopTodo-*-portable.exe -ErrorAction SilentlyContinue
          if (-not $setup) { throw 'NSIS setup artifact missing' }
          if (-not $portable) { throw 'Portable artifact missing' }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-todo-windows
          path: |
            release/DesktopTodo-*-setup.exe
            release/DesktopTodo-*-portable.exe
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/DesktopTodo-*-setup.exe
            release/DesktopTodo-*-portable.exe
          name: ${{ github.ref_name }}
          body: |
            Windows 10/11 桌面版（未做代码签名）。

            - 便携版：双击即用，无需安装、无需管理员权限
            - 安装版：按向导安装，可选择安装目录

            首次运行如出现 SmartScreen「Windows 已保护你的电脑」提示，选择「更多信息 → 仍要运行」。
          fail_on_unmatched_files: true
