name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-win:
    name: Build Windows portable + installer
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pkg = node -p "require('./package.json').version"
          $tag = "${{ github.ref_name }}"
          if ("v$pkg" -ne $tag) {
            throw "Tag $tag does not match package.json version $pkg"
          }

      - name: Typecheck
        run: pnpm typecheck

      - name: Build app
        run: pnpm build

      - name: Fetch better-sqlite3 (Electron ABI)
        run: python scripts/fetch-native-assets.py --skip-electron

      - name: Package Windows (NSIS + portable)
        run: pnpm exec electron-builder --win --publish never

      - name: Verify two packages
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe | Format-Table Name, Length
          $setup = Get-ChildItem release\DesktopTodo-*-setup.exe -ErrorAction SilentlyContinue
          $portable = Get-ChildItem release\DesktopTodo-*-portable.exe -ErrorAction SilentlyContinue
          if (-not $setup) { throw 'NSIS setup artifact missing' }
          if (-not $portable) { throw 'Portable artifact missing' }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-todo-windows
          path: |
            release/DesktopTodo-*-setup.exe
            release/DesktopTodo-*-portable.exe
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/DesktopTodo-*-setup.exe
            release/DesktopTodo-*-portable.exe
          fail_on_unmatched_files: true

  build-mac:
    name: Build macOS arm64 dmg
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          if [ "v$pkg" != "$tag" ]; then
            echo "Tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # 先取 arm64 的 better-sqlite3 electron-ABI 预编译 .node 再打 dmg
      # （npmRebuild: false，一个 .node 只能对应一个架构，见 scripts/dist-mac.cjs 注释）
      - name: Package macOS dmg (arm64)
        run: node scripts/dist-mac.cjs

      - name: Verify package
        run: |
          ls -l release/*.dmg
          test -n "$(ls release/DesktopTodo-*-arm64.dmg 2>/dev/null)" || { echo "arm64 dmg missing" >&2; exit 1; }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-todo-macos
          path: release/DesktopTodo-*-arm64.dmg
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/DesktopTodo-*-arm64.dmg
          fail_on_unmatched_files: true

  release-notes:
    name: Write release notes
    # 两个平台的构建完成后统一写说明（两个构建作业并行发布文件，避免相互覆盖 body）
    needs: [build-win, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish GitHub Release notes
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            桌面待办${GITHUB_REF_NAME}：纯本地任务清单，Windows / macOS 双平台（均未做代码签名）。

            **Windows 10/11（x64）**
            - `DesktopTodo-<version>-portable.exe`：便携版，双击即用，无需安装、无需管理员权限
            - `DesktopTodo-<version>-setup.exe`：安装版，按向导安装，可选择安装目录
            - 首次运行如出现 SmartScreen「Windows 已保护你的电脑」，选「更多信息 → 仍要运行」。

            **macOS 12+（仅 Apple 芯片）**
            - `DesktopTodo-<version>-arm64.dmg`：Apple 芯片（M1/M2/M3/M4…）
            - 打开 dmg 后把「桌面待办」拖到「应用程序」即完成安装。
            - 仅支持 Apple 芯片（arm64）；Intel 芯片 Mac 不在支持范围（不提供 x64 包）。
            - 未签名：首次打开会被 Gatekeeper 拦截（「无法验证开发者」）。请在「应用程序」里
              **右键点图标 → 打开 → 再点「打开」**；或在「系统设置 → 隐私与安全性」里点「仍要打开」。
            - 数据目录：`~/Library/Application Support/DesktopTodo/`（设置 → 数据目录可直接打开）。
